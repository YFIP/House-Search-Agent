name: Scrape and Deploy Listings

on:
  schedule:
    - cron: '13 6 * * *'   # ~2:13 AM EDT (Eastern Daylight Time, UTC-4)
    - cron: '13 7 * * *'   # ~2:13 AM EST (Eastern Standard Time, UTC-5)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape-agent
  cancel-in-progress: false

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if today's scrape has already run
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manually triggered — proceeding regardless of date."
            exit 0
          fi
          TODAY_NY=$(TZ=America/New_York date +%Y-%m-%d)
          LAST_RUN=$(cat .last-scrape-date 2>/dev/null || echo "none")
          echo "Today (US Eastern date): $TODAY_NY"
          echo "Last successful scrape date: $LAST_RUN"
          if [ "$LAST_RUN" = "$TODAY_NY" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Already ran today — skipping (this is the other seasonal trigger, or a delayed re-delivery)."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs Barnes, Barnes-Suburbs, Book-a-Flat, and Perenium in one job.
  #
  # FIX (this pass): Junot removed from this job's scope. It now does
  # real detail-page enrichment (added to recover furnished status — see
  # junot-scraper.js's header comment for the live evidence that furnished
  # status only exists on Junot's detail pages, not the summary card),
  # covers ~50 locations with up to 849 real sale listings, and was at
  # real risk of the same "job times out mid-enrichment, writes nothing
  # at all" failure DanielFeau/Eiffel Housing already hit before being
  # isolated. See scrape-junot / scrape-junot-sale below.
  #
  # SeLoger (Paris-wide) is deliberately NOT run here or anywhere in
  # this pipeline: see original note — the per-arrondissement matrix
  # already covers all of Paris with its own enrichment.
  scrape-main:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth exceljs
      - name: Scrape main sources (excludes SeLoger, SeLoger-Suburbs, Junot)
        run: node scrape-main-sources.js rent details
      - name: Upload main sources output
        uses: actions/upload-artifact@v4
        with:
          name: output-main
          path: output-main.json
          retention-days: 1

  scrape-main-sale:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth exceljs
      - name: Scrape main sources - sale (excludes SeLoger, SeLoger-Suburbs, Junot)
        run: node scrape-main-sources.js sale details
      - name: Upload main sources sale output
        uses: actions/upload-artifact@v4
        with:
          name: output-main-sale
          path: output-main-sale.json
          retention-days: 1

  scrape-seloger-suburb:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { town: neuilly-sur-seine, shard: 0, shardCount: 1 }
          - { town: boulogne-billancourt, shard: 0, shardCount: 2 }
          - { town: boulogne-billancourt, shard: 1, shardCount: 2 }
          - { town: suresnes, shard: 0, shardCount: 1 }
          - { town: levallois-perret, shard: 0, shardCount: 1 }
          - { town: rueil-malmaison, shard: 0, shardCount: 1 }
          - { town: puteaux, shard: 0, shardCount: 1 }
          - { town: saint-cloud, shard: 0, shardCount: 1 }
          - { town: saint-germain-en-laye, shard: 0, shardCount: 1 }
          - { town: le-vesinet, shard: 0, shardCount: 1 }
          - { town: vaucresson, shard: 0, shardCount: 1 }
          - { town: garches, shard: 0, shardCount: 1 }
          - { town: marnes-la-coquette, shard: 0, shardCount: 1 }
          - { town: ville-d-avray, shard: 0, shardCount: 1 }
          - { town: courbevoie, shard: 0, shardCount: 1 }
          - { town: versailles, shard: 0, shardCount: 1 }
          - { town: issy-les-moulineaux, shard: 0, shardCount: 1 }
          - { town: colombes, shard: 0, shardCount: 1 }
