  # Downloads every artifact from all jobs above, merges everything, and
  # writes/commits the final Excel file.
  #
  # FIX (this pass): added scrape-junot and scrape-junot-sale to the
  # needs list, so the merge waits for Junot's isolated job to finish
  # (or fail) before assembling the final output — same as every other
  # isolated source below.
  merge-and-commit:
    needs: [check-schedule, scrape-main, scrape-main-sale, scrape-seloger-suburb, scrape-seloger-suburb-sale, scrape-seloger-arrondissement, scrape-seloger-arrondissement-sale, scrape-parisrental-page, scrape-parisrental-sale, scrape-danielfeau, scrape-danielfeau-sale, scrape-eiffel-housing, scrape-eiffel-housing-sale, scrape-junot, scrape-junot-sale]
