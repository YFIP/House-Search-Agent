name: Scrape and Deploy Listings

on:
  schedule:
    - cron: '13 6 * * *'   # ~2:13 AM EDT (Eastern Daylight Time, UTC-4)
    - cron: '13 7 * * *'   # ~2:13 AM EST (Eastern Standard Time, UTC-5)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape-agent
  cancel-in-progress: false

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if today's scrape has already run
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manually triggered — proceeding regardless of date."
            exit 0
          fi
          TODAY_NY=$(TZ=America/New_York date +%Y-%m-%d)
          LAST_RUN=$(cat .last-scrape-date 2>/dev/null || echo "none")
          echo "Today (US Eastern date): $TODAY_NY"
          echo "Last successful scrape date: $LAST_RUN"
          if [ "$LAST_RUN" = "$TODAY_NY" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Already ran today — skipping (this is the other seasonal trigger, or a delayed re-delivery)."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs Barnes-Suburbs, Book-a-Flat, Perenium, Paris Seine Immobilier,
  # Patrimoine Ouest Parisien, and AFR Immobilier in one job.
  #
  # FIX (this pass): SeLoger removed entirely — its scraper, suburb
  # scraper, arrondissement scraper, and the ~80-shard matrix that ran
  # them (scrape-seloger-suburb*, scrape-seloger-arrondissement* below)
  # are all gone. Barnes also removed from this job's scope, using the
  # CI budget freed up by that removal: scrape-runner.js does real
  # click-until-exhausted pagination (146 rent / 938 sale live listings)
  # plus per-listing detail-page enrichment by default, which was a real
  # risk of the same "job times out mid-run, writes nothing at all"
  # failure DanielFeau/Eiffel Housing/Junot already hit before being
  # isolated. See scrape-barnes / scrape-barnes-sale below.
  #
  # Junot was removed from this job's scope earlier for the same reason:
  # it now does real detail-page enrichment (added to recover furnished
  # status — see junot-scraper.js's header comment for the live evidence
  # that furnished status only exists on Junot's detail pages, not the
  # summary card), covering ~50 locations with up to 849 real sale
  # listings. See scrape-junot / scrape-junot-sale below.
  scrape-main:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth exceljs
      - name: Scrape main sources (excludes Barnes, Orpi, ParisRental, DanielFeau, Eiffel Housing, Junot)
        run: node scrape-main-sources.js rent details
      - name: Upload main sources output
        uses: actions/upload-artifact@v4
        with:
          name: output-main
          path: output-main.json
          retention-days: 1

  scrape-main-sale:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth exceljs
      - name: Scrape main sources - sale (excludes Barnes, Orpi, ParisRental, DanielFeau, Eiffel Housing, Junot)
        run: node scrape-main-sources.js sale details
      - name: Upload main sources sale output
        uses: actions/upload-artifact@v4
        with:
          name: output-main-sale
          path: output-main-sale.json
          retention-days: 1

  scrape-parisrental-page:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { category: furnished, page: 1 }
          - { category: furnished, page: 2 }
          - { category: furnished, page: 3 }
          - { category: furnished, page: 4 }
          - { category: furnished, page: 5 }
          - { category: furnished, page: 6 }
          - { category: furnished, page: 7 }
          - { category: unfurnished, page: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer
      - name: Scrape ${{ matrix.category }} page ${{ matrix.page }} in isolation
        run: node scrape-single-parisrental-page.js ${{ matrix.category }} ${{ matrix.page }}
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: output-parisrental-${{ matrix.category }}-${{ matrix.page }}
          path: output-parisrental-${{ matrix.category }}-${{ matrix.page }}.json
          retention-days: 1

  scrape-parisrental-sale:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer
      - name: Scrape sale listings in isolation
        run: node scrape-single-parisrental-page.js sale 1
      - name: Upload sale result
        uses: actions/upload-artifact@v4
        with:
          name: output-parisrental-sale-1
          path: output-parisrental-sale-1.json
          retention-days: 1

  scrape-danielfeau:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer
      - name: Scrape DanielFeau rent in isolation
        run: node scrape-single-danielfeau.js rent
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: output-danielfeau
          path: output-danielfeau.json
          retention-days: 1

  scrape-danielfeau-sale:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer
      - name: Scrape DanielFeau sale in isolation
        run: node scrape-single-danielfeau.js sale
      - name: Upload sale result
        uses: actions/upload-artifact@v4
        with:
          name: output-danielfeau-sale
          path: output-danielfeau-sale.json
          retention-days: 1

  scrape-eiffel-housing:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
      - name: Scrape Eiffel Housing rent in isolation
        run: node scrape-single-eiffel-housing.js rent
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: output-eiffel-housing
          path: output-eiffel-housing.json
          retention-days: 1

  scrape-eiffel-housing-sale:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
      - name: Scrape Eiffel Housing sale in isolation
        run: node scrape-single-eiffel-housing.js sale
      - name: Upload sale result
        uses: actions/upload-artifact@v4
        with:
          name: output-eiffel-housing-sale
          path: output-eiffel-housing-sale.json
          retention-days: 1

  # NEW (this pass): Junot moved to its own isolated job after adding
  # real detail-page enrichment for furnished status — see
  # junot-scraper.js's header comment for the live evidence that
  # furnished status only exists on the detail page for this source, and
  # scrape-main-sources.js's header comment for why that made it unsafe
  # to keep running inside the shared 15-minute scrape-main budget.
  # Timeout sized generously above DanielFeau's 30 minutes since Junot's
  # confirmed sale volume (849 real listings) is comparable in scale.
  scrape-junot:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer
      - name: Scrape Junot rent in isolation
        run: node scrape-single-junot.js rent
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: output-junot
          path: output-junot.json
          retention-days: 1

  scrape-junot-sale:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer
      - name: Scrape Junot sale in isolation
        run: node scrape-single-junot.js sale
      - name: Upload sale result
        uses: actions/upload-artifact@v4
        with:
          name: output-junot-sale
          path: output-junot-sale.json
          retention-days: 1

  # NEW (this pass): Barnes moved to its own isolated job, using the CI
  # budget freed up by removing SeLoger's ~80-shard matrix. Timeout sized
  # above the 15-minute shared budget it used to share with Barnes-Suburbs/
  # Book-a-Flat/Perenium, since it also does per-listing detail-page
  # enrichment (concurrency 3) over up to 938 live sale listings.
  scrape-barnes:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer
      - name: Scrape Barnes rent in isolation
        run: node scrape-single-barnes.js rent
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: output-barnes
          path: output-barnes.json
          retention-days: 1

  scrape-barnes-sale:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer
      - name: Scrape Barnes sale in isolation
        run: node scrape-single-barnes.js sale
      - name: Upload sale result
        uses: actions/upload-artifact@v4
        with:
          name: output-barnes-sale
          path: output-barnes-sale.json
          retention-days: 1

  # NEW (this pass): Orpi's confirmed live sale volume (451 listings, 31
  # pages) plus per-listing detail-page enrichment is too large for
  # scrape-main's shared budget — same isolated-job treatment as Barnes.
  scrape-orpi:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer
      - name: Scrape Orpi rent in isolation
        run: node scrape-single-orpi.js rent
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: output-orpi
          path: output-orpi.json
          retention-days: 1

  scrape-orpi-sale:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install puppeteer
      - name: Scrape Orpi sale in isolation
        run: node scrape-single-orpi.js sale
      - name: Upload sale result
        uses: actions/upload-artifact@v4
        with:
          name: output-orpi-sale
          path: output-orpi-sale.json
          retention-days: 1

  # Downloads every artifact from all jobs above, merges everything, and
  # writes/commits the final Excel file.
  #
  # FIX (this pass): removed scrape-seloger-suburb/-sale and
  # scrape-seloger-arrondissement/-sale from the needs list (jobs
  # deleted along with SeLoger). Added scrape-barnes/-sale and
  # scrape-orpi/-sale, so the merge waits for their isolated jobs to
  # finish (or fail) before assembling the final output — same as every
  # other isolated source below.
  merge-and-commit:
    needs: [check-schedule, scrape-main, scrape-main-sale, scrape-barnes, scrape-barnes-sale, scrape-orpi, scrape-orpi-sale, scrape-parisrental-page, scrape-parisrental-sale, scrape-danielfeau, scrape-danielfeau-sale, scrape-eiffel-housing, scrape-eiffel-housing-sale, scrape-junot, scrape-junot-sale]
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install exceljs googleapis
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Merge and generate Excel - rent
        run: node merge-and-generate.js rent artifacts
      - name: Merge and generate Excel - sale
        run: node merge-and-generate.js sale artifacts
      - name: Sync to Google Sheets
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEET_ID: '1maB2BiEzEK2XwC-vVHJGJuigdLGSUi9Yyh3psVWHt_I'
        run: node sync-to-google-sheets.js listings.json listings-sale.json
      - name: Record today's run date
        run: TZ=America/New_York date +%Y-%m-%d > .last-scrape-date
      - name: Commit updated Excel files to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add listings.xlsx listings-sale.xlsx .last-scrape-date
          git commit -m "Update listings: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push
      - name: Prepare Pages output
        run: |
          mkdir -p _site
          cp listings.xlsx _site/listings.xlsx
          cp listings.json _site/listings.json
          cp listings-sale.xlsx _site/listings-sale.xlsx
          cp listings-sale.json _site/listings-sale.json
          cp index.html _site/index.html
          cp normalize-area.js _site/normalize-area.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [check-schedule, merge-and-commit]
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
